application:
  subdomain: deluge
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://deluge:8112/
  ingress:
    - protocol: tcp
      port: 6881
      service: deluge
    - protocol: udp
      port: 6881
      service: deluge
    - protocol: tcp
      port: 58846
      service: deluge
services:
  deluge:
    # upstream: linuxserver/deluge:2.1.1
    image: docker.1ms.run/linuxserver/deluge:2.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - DELUGE_LOGLEVEL=error
    binds:
      - /lzcapp/var/config:/config
      - /lzcapp/var/downloads:/downloads
